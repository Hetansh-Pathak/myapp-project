name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-docker-demo:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-docker-demo:latest

            docker stop myapp_new || true
            docker rm myapp_new || true
            docker run -d --name myapp_new -p 3001:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/cicd-docker-demo:latest

            sleep 5
            if curl -f http://localhost:3001/health; then
              docker stop myapp_old || true
              docker rm myapp_old || true
              docker rename myapp_new myapp_old
              sudo systemctl reload nginx
              echo "Deployment successful"
            else
              echo "Health check failed, rolling back"
              docker stop myapp_new
              docker rm myapp_new
              exit 1
            fi
